# Push a version tag to build, sign, notarize and publish Sidelight with a generated changelog:
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Installed copies read appcast.xml from the latest published release. docs/RELEASING.md has the details.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # retry with gh workflow run release.yml --ref v0.1.0

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'Release must run from a version tag'; exit 1; }
          VERSION=${GITHUB_REF_NAME#v}
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release commit must be on main'; exit 1; }
          PREVIOUS_TAG=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -n "$PREVIOUS_TAG" ]]; then
            gh release download "$PREVIOUS_TAG" --pattern appcast.xml --dir "$RUNNER_TEMP/previous"
            export VERSION
            python3 - <<'PY'
          import os, pathlib, subprocess, xml.etree.ElementTree as ET
          ns = '{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          feed = pathlib.Path(os.environ['RUNNER_TEMP']) / 'previous/appcast.xml'
          item = ET.parse(feed).getroot().find('./channel/item')
          build = int(subprocess.check_output(['git', 'rev-list', '--first-parent', '--count', 'HEAD']))
          assert build > int(item.findtext(ns + 'version')), 'Build number must increase'
          version = tuple(map(int, os.environ['VERSION'].split('.')))
          previous = tuple(map(int, item.findtext(ns + 'shortVersionString').split('.')))
          assert version > previous, 'Release version must increase'
          PY
          fi
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Check
        run: make check

  release:
    needs: check
    runs-on: xcode-27
    timeout-minutes: 60
    # Holds the signing secrets, and only deploys from v* tags.
    environment: release
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build-app.sh derives the build number from the commit count
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Check release credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_API_KEY NOTARY_KEY_ID NOTARY_ISSUER SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing release environment secret: $name"; exit 1; }
          done
      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          PREVIOUS_TAG=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          OPTIONS=(-f tag_name="$GITHUB_REF_NAME")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            OPTIONS+=(-f previous_tag_name="$PREVIOUS_TAG")
          fi
          # Sparkle's Markdown renderer displays HTML comments as text; remove GitHub's internal metadata.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${OPTIONS[@]}" --jq .body \
            | sed '/^<!-- Release notes generated using .* -->$/d' > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Import signing certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/developer-id.p12"
      - name: Build, sign and notarize
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_API_KEY" > "$NOTARY_KEY_PATH"
          scripts/release.sh "$VERSION" "$RUNNER_TEMP/notes.md"
      - name: Preserve release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sidelight-${{ env.VERSION }}
          path: |
            build/release/*.dmg
            build/release/*.sha256
            build/release/appcast.xml
            build/release/Sidelight.dSYM
          if-no-files-found: error
          retention-days: 30
      - name: Upload, verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$VERSION" "$RUNNER_TEMP/notes.md"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12"
