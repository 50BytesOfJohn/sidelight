<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;overflow:hidden;background:transparent;font:12px -apple-system,system-ui;color:#fff;color-scheme:light dark}
@media (prefers-color-scheme: light){body{color:#111}}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px}
.dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#7af,#c6f);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.big{font-size:20px;font-weight:600}.dim{opacity:.6}
</style></head><body>
<div class="row"><div class="dot"></div><div><div class="dim">HTML widget (WKWebView)</div>
<div class="big" id="w">…</div><div class="dim" id="d">day of year: …</div></div></div>
<script>
const now=new Date(), start=new Date(now.getFullYear(),0,0);
document.getElementById('d').textContent='day of year: '+Math.floor((now-start)/864e5)+' · JS ok';
async function wx(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.23&longitude=21.01&current=temperature_2m,wind_speed_10m');
const j=await r.json();document.getElementById('w').textContent='Warsaw '+j.current.temperature_2m+'°C, wind '+j.current.wind_speed_10m+' km/h';}
catch(e){document.getElementById('w').textContent='fetch failed: '+e}}
wx();setInterval(wx,15*60*1000);
</script></body></html>
